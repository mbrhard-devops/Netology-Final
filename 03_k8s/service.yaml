apiVersion: v1
kind: Service
metadata:
  name: diplom-flask-app-service
spec:
  type: LoadBalancer # Яндекс создаст внешний балансировщик
  selector:
    app: diplom-flask-app
  ports:
    - protocol: TCP
      port: 80          # Порт, на котором будет доступен сервис снаружи
      targetPort: 5000  # Порт внутри контейнера
