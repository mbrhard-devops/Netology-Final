name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - '01_terraform/**' # Запускается только при изменениях в папке terraform

env:
  TF_VAR_folder_id: b1gep0d4pp10h24g8gd0
  TF_VAR_cloud_id: b1gd2s0bh49gmd73m704

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./01_terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Yandex Cloud Login
        run: |
          echo '${{ secrets.YC_SA_JSON }}' > /tmp/sa-key.json
          yc config profile create github-actions
          yc config set service-account-key /tmp/sa-key.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_sa_key_file: /tmp/sa-key.json
